---
# Selene standard library extension: globals TestEZ injects into *.spec.luau files.
base: roblox
name: testez
globals:
  describe:
    args:
      - type: string
      - type: function
  it:
    args:
      - type: string
      - type: function
  expect:
    args:
      - type: any
  beforeAll:
    args:
      - type: function
  afterAll:
    args:
      - type: function
  beforeEach:
    args:
      - type: function
  afterEach:
    args:
      - type: function
  FOCUS:
    args: []
  SKIP:
    args: []
  __LUNE_RUNTIME__:
    property: read-only
